<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @media (prefers-color-scheme: light) {
      .bg-circle { fill: #3b82f6; }
      .bg-stroke { stroke: #1e40af; }
      .clock-face { fill: white; }
      .clock-stroke { stroke: #1e40af; }
      .markers { fill: #1e40af; }
      .hour-hand { stroke: #1e40af; }
      .minute-hand { stroke: #3b82f6; }
      .center-dot { fill: #1e40af; }
      .book1 { fill: #ef4444; }
      .book2 { fill: #f97316; }
      .book3 { fill: #eab308; }
    }
    @media (prefers-color-scheme: dark) {
      .bg-circle { fill: #1e40af; }
      .bg-stroke { stroke: #60a5fa; }
      .clock-face { fill: #1e293b; }
      .clock-stroke { stroke: #60a5fa; }
      .markers { fill: #60a5fa; }
      .hour-hand { stroke: #60a5fa; }
      .minute-hand { stroke: #3b82f6; }
      .center-dot { fill: #60a5fa; }
      .book1 { fill: #dc2626; }
      .book2 { fill: #ea580c; }
      .book3 { fill: #ca8a04; }
    }
  </style>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" class="bg-circle bg-stroke" stroke-width="3"/>
  
  <!-- Clock face -->
  <circle cx="100" cy="100" r="75" class="clock-face clock-stroke" stroke-width="4"/>
  
  <!-- Hour markers (12, 3, 6, 9 positions) -->
  <circle cx="100" cy="35" r="4" class="markers"/>
  <circle cx="165" cy="100" r="4" class="markers"/>
  <circle cx="100" cy="165" r="4" class="markers"/>
  <circle cx="35" cy="100" r="4" class="markers"/>
  
  <!-- Secondary markers -->
  <circle cx="135" cy="50" r="3" class="markers"/>
  <circle cx="150" cy="135" r="3" class="markers"/>
  <circle cx="65" cy="150" r="3" class="markers"/>
  <circle cx="50" cy="65" r="3" class="markers"/>
  
  <!-- Clock hands -->
  <!-- Hour hand (pointing to 10) -->
  <line x1="100" y1="100" x2="75" y2="65" class="hour-hand" stroke-width="6" stroke-linecap="round"/>
  <!-- Minute hand (pointing to 2) -->
  <line x1="100" y1="100" x2="130" y2="70" class="minute-hand" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" class="center-dot"/>
  
  <!-- Stacked books element at bottom (representing study/practice) -->
  <rect x="70" y="145" width="60" height="8" rx="2" class="book1"/>
  <rect x="75" y="138" width="50" height="8" rx="2" class="book2"/>
  <rect x="80" y="131" width="40" height="8" rx="2" class="book3"/>
</svg>