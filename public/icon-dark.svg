<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e40af" stroke="#60a5fa" stroke-width="3"/>
  
  <!-- Clock face -->
  <circle cx="100" cy="100" r="75" fill="#1e293b" stroke="#60a5fa" stroke-width="4"/>
  
  <!-- Hour markers (12, 3, 6, 9 positions) -->
  <circle cx="100" cy="35" r="4" fill="#60a5fa"/>
  <circle cx="165" cy="100" r="4" fill="#60a5fa"/>
  <circle cx="100" cy="165" r="4" fill="#60a5fa"/>
  <circle cx="35" cy="100" r="4" fill="#60a5fa"/>
  
  <!-- Secondary markers -->
  <circle cx="135" cy="50" r="3" fill="#60a5fa"/>
  <circle cx="150" cy="135" r="3" fill="#60a5fa"/>
  <circle cx="65" cy="150" r="3" fill="#60a5fa"/>
  <circle cx="50" cy="65" r="3" fill="#60a5fa"/>
  
  <!-- Clock hands -->
  <!-- Hour hand (pointing to 10) -->
  <line x1="100" y1="100" x2="75" y2="65" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <!-- Minute hand (pointing to 2) -->
  <line x1="100" y1="100" x2="130" y2="70" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="#60a5fa"/>
  
  <!-- Stacked books element at bottom (representing study/practice) -->
  <rect x="70" y="145" width="60" height="8" rx="2" fill="#dc2626"/>
  <rect x="75" y="138" width="50" height="8" rx="2" fill="#ea580c"/>
  <rect x="80" y="131" width="40" height="8" rx="2" fill="#ca8a04"/>
</svg>
